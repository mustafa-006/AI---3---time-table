<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI - 3 - time table</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="task.ico">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- tsParticles Container -->
    <div id="tsparticles"></div>
    <div class="glow-bg"></div>
    
    <div class="app-container">
        <!-- Screen 1: Section Selection -->
        <section id="screen-sections" class="screen active">
            <header>
                <h1>AI - 3 - time table</h1>
                <p>اختر السكشن الخاص بك</p>
            </header>
            <div class="grid-container" id="sections-grid">
                <!-- Cards generated by JS -->
            </div>
        </section>

        <!-- Screen 2: Week Selection -->
        <section id="screen-weeks" class="screen hidden">
            <header class="screen-header">
                <button class="back-btn" id="btn-back-sections" aria-label="رجوع">رجوع</button>
                <div class="header-content">
                    <h1 id="week-title">جدول سكشن</h1>
                    <p>اختر الأسبوع</p>
                </div>
            </header>
            
            <!-- 3D Robot -->
            <div class="robot-wrapper">
                <div class="scene">
                  <div class="floor">
                    <div class="shadow"></div>
                  </div>
                  <div class="swing">
                    <div class="structure">
                      <div class="top">
                        <i></i><i></i><i></i><i></i><i></i><i></i>
                      </div>
                      <div class="legs">
                        <div>
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                        </div>
                        <div>
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                        </div>
                      </div>
                      <div class="legs">
                        <div>
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                        </div>
                        <div>
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                        </div>
                      </div>
                    </div>
                    <div class="moving">
                      <div class="line"></div>
                      <div class="line"></div>
                      <div class="seat">
                        <i></i><i></i><i></i><i></i><i></i><i></i>
                      </div>
                      
                      <div class="robot">
                        <div class="thigh">
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                          <div class="calf">
                            <i></i><i></i><i></i><i></i><i></i><i></i>
                            <div class="foot">
                              <i></i><i></i><i></i><i></i><i></i><i></i>
                            </div>
                          </div>
                        </div>
                        <div class="thigh">
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                          <div class="calf">
                            <i></i><i></i><i></i><i></i><i></i><i></i>
                            <div class="foot">
                              <i></i><i></i><i></i><i></i><i></i><i></i>
                            </div>
                          </div>
                        </div>
                        
                        <div class="thorax">
                          <i></i><i></i><i></i><i></i><i></i><i></i>
                          <div class="neck">
                            <i></i><i></i><i></i><i></i><i></i><i></i>
                            <div class="head">
                              <i></i><i></i><i></i><i></i><i></i><i></i>
                            </div>
                          </div>
                          <div class="arm">
                            <i></i><i></i><i></i><i></i><i></i><i></i>
                            <div class="hand">
                              <i></i><i></i><i></i><i></i><i></i><i></i>
                            </div>
                          </div>
                          <div class="arm">
                            <i></i><i></i><i></i><i></i><i></i><i></i>
                            <div class="hand">
                              <i></i><i></i><i></i><i></i><i></i><i></i>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
            </div>

            <div class="grid-container cards-large">
                <div class="card week-card" data-week="1">الأسبوع الأول</div>
                <div class="card week-card" data-week="2">الأسبوع الثاني</div>
            </div>
        </section>

        <!-- Screen 3: Schedule View -->
        <section id="screen-schedule" class="screen hidden">
            <header class="screen-header">
                <button class="back-btn" id="btn-back-weeks" aria-label="رجوع">رجوع</button>
                <div class="header-content">
                    <h1 id="schedule-title">الجدول</h1>
                </div>
            </header>
            <div class="schedule-container" id="schedule-content">
                <!-- Schedule generated by JS -->
            </div>
        </section>
    </div>

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
